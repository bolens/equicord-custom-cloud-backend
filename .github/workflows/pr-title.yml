name: PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const pattern = /^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?!?: .+/;
            if (!pattern.test(process.env.PR_TITLE)) core.setFailed('Use a Conventional Commit PR title.');
